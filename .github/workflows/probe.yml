# Probe: after FinalizeArtifact, does the official artifact-v4 backend still
# accept writes to the CreateArtifact signedUploadUrl, and do those bytes reach
# a later downloader?
name: artifact-post-finalize-overwrite-probe
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  a-upload-finalize:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.probe1.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - id: probe1
        uses: ./probe-action
        with:
          mode: upload
  b-post-finalize-overwrite:
    runs-on: ubuntu-latest
    needs: a-upload-finalize
    steps:
      - uses: actions/checkout@v4
      - uses: ./probe-action
        with:
          mode: mutate
          upload_url: ${{ needs.a-upload-finalize.outputs.upload_url }}
  c-downstream-download:
    runs-on: ubuntu-latest
    needs: [a-upload-finalize, b-post-finalize-overwrite]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: probe
          path: got
      - run: |
          set -eu
          ls -la got
          echo "GOT_CONTENT=$(cat got/payload.txt)"
